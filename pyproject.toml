[project]
name = "europepmc-mcp"
version = "0.1.0"
description = "MCP server over Europe PMC that returns grounded evidence with licence gates and provenance"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Alessandro Pedori", email = "ischender@users.noreply.github.com" }]
keywords = ["mcp", "europepmc", "evidence", "grounding", "literature"]
dependencies = [
    "mcp==2.2.0",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "tenacity==9.1.4",
]

[project.urls]
Homepage = "https://github.com/ischender/europepmc-evidence-mcp"
Repository = "https://github.com/ischender/europepmc-evidence-mcp"
Issues = "https://github.com/ischender/europepmc-evidence-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.16.8",
    "mypy==1.18.2",
    "pyyaml==6.0.3",
]

[project.scripts]
europepmc-mcp = "europepmc_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/europepmc_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
