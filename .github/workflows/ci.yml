name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Pytest
        run: uv run pytest
