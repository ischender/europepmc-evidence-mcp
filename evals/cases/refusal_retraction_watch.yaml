meta:
  source: Retraction Watch Database (via Crossref)
  source_url: https://gitlab.com/crossref/retraction-watch-data
  source_licence: CC0 (Crossref distribution)
  note: Independent retraction truth. Valuable precisely because this server derives
    retraction status from Europe PMC's own pubTypeList — so this checks one source
    against another rather than against itself.
  retrieval_date: '2026-09-18'
